<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="refresh" content="5; url=Home/home.html">
	<title>Đang chuyển hướng...</title>
	<style>
		:root {
			--bg-1: #07131f;
			--bg-2: #101d34;
			--panel: rgba(11, 23, 37, 0.7);
			--panel-border: rgba(148, 163, 184, 0.18);
			--text: #edf6ff;
			--muted: #a7b5c8;
			--primary: #6ee7ff;
			--secondary: #8b5cf6;
			--accent: #22c55e;
		}

		* {
			box-sizing: border-box;
		}

		html, body {
			height: 100%;
		}

		body {
			margin: 0;
			display: grid;
			place-items: center;
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			background:
				radial-gradient(circle at top, rgba(110, 231, 255, 0.18), transparent 35%),
				radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.22), transparent 30%),
				linear-gradient(135deg, var(--bg-1), var(--bg-2));
			color: var(--text);
			overflow: hidden;
		}

		body::before {
			content: "";
			position: fixed;
			inset: 0;
			background-image:
				linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
				linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
			background-size: 32px 32px;
			mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
			pointer-events: none;
		}

		.shell {
			position: relative;
			width: min(90vw, 620px);
			padding: 2.2rem 2rem 1.7rem;
			border: 1px solid var(--panel-border);
			border-radius: 24px;
			background: var(--panel);
			backdrop-filter: blur(14px);
			box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
			text-align: center;
		}

		.badge {
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
			padding: 0.5rem 0.9rem;
			border-radius: 999px;
			font-size: 0.75rem;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: var(--primary);
			background: rgba(110, 231, 255, 0.08);
			border: 1px solid rgba(110, 231, 255, 0.25);
		}

		.badge::before {
			content: "";
			display: block;
			width: 0.6rem;
			height: 0.6rem;
			border-radius: 50%;
			background: var(--accent);
			box-shadow: 0 0 18px rgba(34, 197, 94, 0.95);
			animation: pulse 1.6s ease-in-out infinite;
		}

		h1 {
			margin: 1.3rem 0 0.8rem;
			font-size: clamp(2.2rem, 5vw, 4rem);
			line-height: 1.1;
			letter-spacing: -0.05em;
		}

		.subtitle {
			margin: 0;
			color: var(--muted);
			font-size: 1.05rem;
		}

		.meta {
			margin-top: 1.5rem;
			padding: 0.8rem 1rem;
			border-radius: 14px;
			background: rgba(148, 163, 184, 0.06);
			border: 1px solid rgba(148, 163, 184, 0.12);
			color: var(--muted);
			font-size: 0.96rem;
		}

		.loader {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 0.7rem;
			margin-top: 1.5rem;
			padding: 0.7rem 1rem;
		}

		.loader span {
			display: block;
			width: 0.85rem;
			height: 0.85rem;
			border-radius: 50%;
			background: linear-gradient(135deg, var(--primary), var(--secondary));
			animation: bounce 1.2s ease-in-out infinite;
		}

		.loader span:nth-child(2) {
			animation-delay: 0.15s;
		}

		.loader span:nth-child(3) {
			animation-delay: 0.3s;
		}

		.cta {
			display: inline-block;
			margin-top: 1.8rem;
			padding: 0.95rem 1.6rem;
			border-radius: 14px;
			font-size: 1rem;
			font-weight: 700;
			text-decoration: none;
			color: #05131f;
			background: linear-gradient(135deg, var(--primary), #d5f7ff);
			box-shadow: 0 18px 35px rgba(110, 231, 255, 0.35);
			transition: transform 0.2s ease, box-shadow 0.2s ease;
		}

		.cta:hover {
			transform: translateY(-2px);
			box-shadow: 0 22px 45px rgba(110, 231, 255, 0.45);
		}

		@keyframes pulse {
			0%, 100% {
				opacity: 1;
				transform: scale(1);
			}
			50% {
				opacity: 0.6;
				transform: scale(1.2);
			}
		}

		@keyframes bounce {
			0%, 80%, 100% {
				opacity: 0.45;
				transform: translateY(0) scale(0.8);
			}
			40% {
				opacity: 1;
				transform: translateY(-8px) scale(1.1);
			}
		}

		@media (max-width: 480px) {
			.shell {
				padding: 1.5rem 1.1rem 1.2rem;
			}

			.meta {
				font-size: 0.88rem;
			}
		}
	</style>
</head>
<body>
	<main class="shell">
		<div class="badge">Đang tải thế giới</div>
		<h1>MMORPG World</h1>
		<p class="subtitle">Nếu trình duyệt không tự chuyển hướng, bạn có thể truy cập ngay vào sảnh chờ game.</p>

		<div class="loader" aria-label="Đang tải">
			<span></span>
			<span></span>
			<span></span>
		</div>

		<div class="meta">Tự động chuyển hướng sau 5 giây...</div>
		<a class="cta" href="Home/home.html">Vào game ngay</a>
	</main>
</body>
</html>
